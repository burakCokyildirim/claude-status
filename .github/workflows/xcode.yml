name: Xcode Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-plugin:
    name: Build Plugin
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clawde-plugin/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('clawde-plugin/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build plugin binaries
        run: |
          cd clawde-plugin
          cargo build --release
          mkdir -p plugins/clawde/scripts
          cp target/release/session-status plugins/clawde/scripts/
          cp target/release/set-session-name plugins/clawde/scripts/
          codesign -fs - plugins/clawde/scripts/session-status
          codesign -fs - plugins/clawde/scripts/set-session-name

      - name: Archive plugin binaries
        run: |
          tar -C clawde-plugin/plugins/clawde -czf plugin-binaries.tgz scripts

      - name: Upload plugin binaries
        uses: actions/upload-artifact@v7
        with:
          name: plugin-binaries
          path: plugin-binaries.tgz
          retention-days: 1

  build:
    name: Build
    needs: build-plugin
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download plugin binaries
        uses: actions/download-artifact@v8
        with:
          name: plugin-binaries
          path: .

      - name: Extract plugin binaries
        run: |
          mkdir -p clawde-plugin/plugins/clawde
          tar -xzf plugin-binaries.tgz -C clawde-plugin/plugins/clawde

      - name: Build
        run: |
          xcodebuild clean build \
            -project "Clawde.xcodeproj" \
            -scheme "Clawde" \
            -destination "platform=macOS" \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Test
    needs: build-plugin
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download plugin binaries
        uses: actions/download-artifact@v8
        with:
          name: plugin-binaries
          path: .

      - name: Extract plugin binaries
        run: |
          mkdir -p clawde-plugin/plugins/clawde
          tar -xzf plugin-binaries.tgz -C clawde-plugin/plugins/clawde

      - name: Test
        run: |
          xcodebuild test \
            -project "Clawde.xcodeproj" \
            -scheme "Clawde" \
            -destination "platform=macOS" \
            -only-testing:"ClawdeTests" \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
